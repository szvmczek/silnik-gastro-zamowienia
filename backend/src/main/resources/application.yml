spring:
  application:
    name: pizza-showcase
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@pizza-demo.local}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
