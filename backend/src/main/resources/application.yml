spring:
  application:
    name: pizza-showcase
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
# `hibernate.jdbc.time_zone: UTC` celowo USUNIĘTE (design v3, M4).
#
# Ustawienie wiązało parametry temporalne kalendarzem UTC, co dla kolumn
# `time without time zone` (opening_hours.open_time / close_time) dawało
# przesunięcie o offset strefy serwera na epoce 1970-01-01 — czyli +1 h dla
# Europe/Warsaw. Godzina 12:00 zapisana w bazie wracała z API jako 13:00.
# Nie było tego widać wcześniej, bo zapis z panelu przesuwał o -1 h i
# round-trip przez UI się zgadzał; ujawnił to dopiero seed pisany SQL-em.
#
# Usunięcie jest bezpieczne: jedyne kolumny temporalne mapowane przez
# Hibernate to `timestamp with time zone` (Instant), gdzie PostgreSQL i tak
# trzyma moment absolutny i wynik nie zależy od tego ustawienia. Jedyna
# kolumna `timestamp without time zone` w schemacie należy do Flyway
# i nie jest mapowana encją.
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

# Co realnie stoi na środowisku — jednym curlem, bez zgadywania z hashy
# assetów. Railway wstrzykuje te zmienne automatycznie przy każdym buildzie;
# lokalnie i w Dockerze bez nich wyjdzie "unknown", co samo w sobie jest
# poprawną odpowiedzią („to nie jest deploy z Railway").
#
# Powód: po wdrożeniu rundy poprawek 2026-08-10 produkcja serwowała stary
# commit, a jedynym sposobem sprawdzenia tego było pobieranie assetów
# i porównywanie ich treści z lokalnym buildem.
info:
  git:
    commit: ${RAILWAY_GIT_COMMIT_SHA:unknown}
    branch: ${RAILWAY_GIT_BRANCH:unknown}
  deployment:
    id: ${RAILWAY_DEPLOYMENT_ID:unknown}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 12
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@pizza-demo.local}
    password: ${ADMIN_PASSWORD:}
    display-name: ${ADMIN_DISPLAY_NAME:Admin}
