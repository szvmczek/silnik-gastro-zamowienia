# Production profile. Wymagane env vars:
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET (min 64 znaki)
#   CORS_ALLOWED_ORIGINS (https://twoja-domena.com)
#   ADMIN_EMAIL, ADMIN_PASSWORD

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: INFO
    com.pizzashowcase: INFO

server:
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: false
      pattern: '%h %l %u %t "%m %U" %s %b'

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
