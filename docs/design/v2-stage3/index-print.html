<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pizza Demo · Stage 3 · Admin Redesign — Print</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* Same admin chrome as index.html */
  html, body { margin: 0; padding: 0; background: #ECEAE3; font-family: var(--font-sans); }
  .admin {
    --admin-shell: #F4F2EC;
    --admin-shell-border: #E2DED2;
    --admin-canvas: #FAFAF8;
    --admin-card: #FFFFFF;
    --admin-card-border: #E5E1D6;
    --admin-card-border-hover: #D4D0C2;
    --admin-row-hover: #F7F4ED;
    --admin-divider: #EDE9DF;
    --admin-text-primary: #1A1A1A;
    --admin-text-body: #3F3F3A;
    --admin-text-muted: #6B6B66;
    --admin-text-faint: #A8A59C;
    --admin-nav-active-bg: #FCEEEF;
    --admin-nav-active-text: #C0202E;
    --admin-nav-hover-bg: #EFEBDF;
    --admin-radius: 8px;
    --admin-radius-sm: 6px;
    --admin-radius-card: 10px;
    background: var(--admin-canvas);
    color: var(--admin-text-primary);
    font-family: var(--font-sans);
    font-feature-settings: "ss01", "cv11";
  }
  .admin[data-tone="cool"] {
    --admin-shell: #F2F4F7; --admin-shell-border: #E4E7EC; --admin-canvas: #FFFFFF;
    --admin-card-border: #E4E7EC; --admin-row-hover: #F7F8FA; --admin-divider: #EAECF0;
    --admin-text-primary: #101828; --admin-text-body: #344054; --admin-text-muted: #667085;
    --admin-text-faint: #98A2B0; --admin-nav-hover-bg: #EAECF0;
  }
  .admin[data-density="compact"] { --admin-card-pad: 14px; --admin-row-h: 56px; --admin-card-gap: 10px; }
  .admin[data-density="comfortable"] { --admin-card-pad: 20px; --admin-row-h: 72px; --admin-card-gap: 16px; }
  .scrollbox::-webkit-scrollbar { display: none; }

  .ph-chart {
    background:
      linear-gradient(180deg, transparent 0 calc(100% - 1px), var(--admin-divider) 100%),
      repeating-linear-gradient(0deg, transparent 0 39px, var(--admin-divider) 39px 40px);
    border-radius: var(--admin-radius);
  }
  .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-weight: 700; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600;
    line-height: 1; letter-spacing: 0.01em; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }
  .hr-soft { height: 1px; background: var(--admin-divider); border: 0; }

  /* Print page layout */
  .print-page {
    background: #ECEAE3;
    padding: 32px 32px 24px;
    break-after: page;
    page-break-after: always;
  }
  .print-page:last-child { break-after: auto; page-break-after: auto; }
  .print-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid #C8C4B6;
  }
  .print-header .num {
    font-family: var(--font-mono); font-size: 11px; color: #6B6B66; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .print-header .title {
    font-size: 14px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.005em;
  }
  .print-header .meta {
    font-family: var(--font-mono); font-size: 10px; color: #6B6B66;
  }
  .print-frame {
    background: #FAFAF8;
    border: 1px solid #D4D0C2;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  /* mobile artboards centered */
  .print-frame.mobile {
    margin: 0 auto;
    max-width: 420px;
  }

  .cover {
    min-height: 100vh;
    background: #1A1A1A;
    color: #FAFAF8;
    padding: 80px 64px;
    display: flex; flex-direction: column; justify-content: space-between;
    break-after: page;
    page-break-after: always;
  }
  .cover .brand {
    display: flex; align-items: center; gap: 14px;
  }
  .cover .brand-mark {
    width: 48px; height: 48px; border-radius: 12px; background: var(--color-primary);
    display: grid; place-items: center; font-family: ui-serif, Georgia, serif;
    font-weight: 700; font-size: 24px; color: #fff;
  }
  .cover h1 {
    font-size: 72px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02;
    margin: 0 0 24px; max-width: 900px;
  }
  .cover .kicker {
    font-size: 13px; color: #F4A261; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight: 600; margin-bottom: 18px;
  }
  .cover p {
    font-size: 18px; line-height: 1.55; color: #CFCFC9; max-width: 720px; margin: 0;
  }
  .cover .toc {
    margin-top: 48px; columns: 2; column-gap: 48px; font-size: 14px; color: #CFCFC9;
    line-height: 1.9;
  }
  .cover .toc strong { color: #FAFAF8; }
  .cover .footer {
    font-size: 12px; color: #7A7A75; display: flex; justify-content: space-between;
  }

  @page {
    size: A3 landscape;
    margin: 0;
  }
  @media print {
    html, body { background: #ECEAE3 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .print-page, .cover { page-break-after: always; break-after: page; }
    .print-page:last-child, .cover:last-child { page-break-after: auto; break-after: auto; }
    .print-frame { break-inside: avoid; page-break-inside: avoid; }
    .cover { min-height: auto; height: 100vh; }
    /* turn off animations */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  /* On-screen container width matches A3 landscape (~1587 × 1123 px @ 96dpi w/ 0 margin) */
  body { max-width: 1600px; margin: 0 auto; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Admin shared primitives (icons, chrome, status pills, fixtures) -->
  <script type="text/babel" src="admin-shared.jsx"></script>

  <!-- Frame components -->
  <script type="text/babel" src="frame-login.jsx"></script>
  <script type="text/babel" src="frame-dashboard.jsx"></script>
  <script type="text/babel" src="frame-kitchen.jsx"></script>
  <script type="text/babel" src="frame-pickup.jsx"></script>
  <script type="text/babel" src="frame-delivery.jsx"></script>
  <script type="text/babel" src="frame-orders.jsx"></script>
  <script type="text/babel" src="frame-order-detail.jsx"></script>
  <script type="text/babel" src="frame-menu.jsx"></script>
  <script type="text/babel" src="frame-product-edit.jsx"></script>

  <script type="text/babel">
    /* Fixed-size frame wrapper: render frame at native size, scale down to fit page width */
    const PrintFrame = ({ width, height, mobile = false, fitWidth = 1480, children }) => {
      // page work area ~1480 wide, ~1000 tall after header
      const scale = Math.min(fitWidth / width, 1);
      return (
        <div className={"print-frame" + (mobile ? " mobile" : "")} style={{
          width: width * scale, height: height * scale,
          margin: "0 auto"
        }}>
          <div style={{
            width: width, height: height, transform: `scale(${scale})`, transformOrigin: "top left"
          }}>
            {children}
          </div>
        </div>
      );
    };

    const PrintPage = ({ num, total, title, subtitle, dim, children }) => (
      <div className="print-page">
        <div className="print-header">
          <div style={{ display: "flex", alignItems: "baseline", gap: 14 }}>
            <span className="num">{String(num).padStart(2,"0")} / {String(total).padStart(2,"0")}</span>
            <span className="title">{title}</span>
            <span style={{ color: "#A8A59C", fontSize: 12 }}>{subtitle}</span>
          </div>
          <span className="meta">{dim} · Pizza Demo · Stage 3</span>
        </div>
        {children}
      </div>
    );

    const COMMON = { tone: "warm", density: "comfortable", soundOn: true, manualClose: false,
                     newCount: 5, highlightNote: true };

    const slides = [
      { title: "Login · Logowanie", subtitle: "Brand split, single column form",
        w: 1440, h: 900, comp: () => <window.LoginFrame {...COMMON} /> },
      { title: "Login · Stan błędu", subtitle: "Inline error pattern",
        w: 1440, h: 900, comp: () => <window.LoginFrame {...COMMON} error /> },
      { title: "Pulpit · /admin", subtitle: "4 KPI · 5 status tiles · 2 wykresy · top produkty",
        w: 1440, h: 1100, comp: () => <window.DashboardFrame {...COMMON} /> },
      { title: "Kuchnia · /admin/kitchen", subtitle: "Priorytet #1 · 3 kolumny · urgent pulse po 7 min",
        w: 1440, h: 900, comp: () => <window.KitchenFrame {...COMMON} /> },
      { title: "Kuchnia · tablet 1024 · compact", subtitle: "Density tweak demo + SSE live",
        w: 1024, h: 900, comp: () => <window.KitchenFrame {...COMMON} density="compact" sseSimulate /> },
      { title: "Wydanie · /admin/pickup", subtitle: "Focal: imię klienta + slot time",
        w: 1440, h: 900, comp: () => <window.PickupFrame {...COMMON} /> },
      { title: "Dostawa · desktop", subtitle: "Do zabrania + W drodze + driver",
        w: 1440, h: 900, comp: () => <window.DeliveryFrame {...COMMON} /> },
      { title: "Dostawa · mobile 375", subtitle: "Kurier z telefonem · focal: adres",
        w: 420, h: 860, mobile: true, comp: () => <window.DeliveryFrame {...COMMON} mobile /> },
      { title: "Wszystkie zamówienia", subtitle: "Filtry chip + tabela + paginacja",
        w: 1440, h: 1000, comp: () => <window.OrdersFrame {...COMMON} /> },
      { title: "Wszystkie zamówienia · just-landed", subtitle: "Wariant: zielony flash dla nowego zamówienia",
        w: 1440, h: 1000, comp: () => <window.OrdersFrame {...COMMON} flashNew /> },
      { title: "Detal zamówienia", subtitle: "Notka klienta · timeline · totals",
        w: 1440, h: 1000, comp: () => <window.OrderDetailFrame {...COMMON} /> },
      { title: "Detal · dialog Zmień ETA", subtitle: "Quick presets + custom",
        w: 1440, h: 1000, comp: () => <window.OrderDetailFrame {...COMMON} dialog="eta" /> },
      { title: "Detal · dialog Anuluj zamówienie", subtitle: "Powód + potwierdzenie destrukcyjne",
        w: 1440, h: 1000, comp: () => <window.OrderDetailFrame {...COMMON} dialog="cancel" /> },
      { title: "Menu · Produkty", subtitle: "4 taby + drag handles + toggle aktywny",
        w: 1440, h: 900, comp: () => <window.MenuFrame {...COMMON} activeTab="products" /> },
      { title: "Menu · Kategorie", subtitle: "Sortowanie i porządek",
        w: 1440, h: 700, comp: () => <window.MenuFrame {...COMMON} activeTab="categories" /> },
      { title: "Edycja produktu", subtitle: "Warianty rozmiaru + grupy dodatków + flagi",
        w: 1440, h: 1100, comp: () => <window.ProductEditFrame {...COMMON} /> }
    ];

    function Cover() {
      return (
        <div className="cover">
          <div>
            <div className="brand">
              <div className="brand-mark">P</div>
              <div>
                <div style={{ fontSize: 17, fontWeight: 700 }}>Pizza Demo</div>
                <div style={{ fontSize: 11, color: "#A8A59C", letterSpacing: 0.06, textTransform: "uppercase" }}>
                  Panel admina
                </div>
              </div>
            </div>
            <div style={{ marginTop: 96 }}>
              <div className="kicker">Stage 3 · Admin Redesign</div>
              <h1>Panel<br/>do operacji<span style={{ color: "var(--color-primary)" }}>.</span></h1>
              <p>
                9&nbsp;ekranów dla zespołu w&nbsp;jednej restauracji. Priorytet — kuchnia.
                Rozmiary docelowe: desktop&nbsp;1440, tablet&nbsp;1024, mobile&nbsp;375 dla&nbsp;kuriera.
                Tonacja, gęstość i&nbsp;wyróżnianie notek klienta sterowane przez Tweaks.
              </p>
            </div>
            <div className="toc">
              <div><strong>0 Auth</strong> · Logowanie</div>
              <div><strong>1 Operacje</strong> · Pulpit · Kuchnia · Wydanie · Dostawa</div>
              <div><strong>2 Archiwum</strong> · Lista · Detal · Dialogs</div>
              <div><strong>3 Konfiguracja</strong> · Menu · Edycja produktu</div>
            </div>
          </div>
          <div className="footer">
            <span>Wersja 5.0 · {slides.length}&nbsp;ekranów</span>
            <span>pizzademo.pl/admin</span>
          </div>
        </div>
      );
    }

    function PrintApp() {
      return (
        <>
          <Cover />
          {slides.map((s, i) => (
            <PrintPage key={i}
              num={i + 1} total={slides.length}
              title={s.title} subtitle={s.subtitle}
              dim={`${s.w} × ${s.h}`}>
              <PrintFrame width={s.w} height={s.h} mobile={s.mobile}>
                {s.comp()}
              </PrintFrame>
            </PrintPage>
          ))}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PrintApp />);

    /* Auto-print after fonts + JSX + safety delay */
    (async () => {
      try { await document.fonts.ready; } catch (_) {}
      // Wait for all frames to mount (heavy markup, many components)
      await new Promise(r => setTimeout(r, 1200));
      window.print();
    })();
  </script>
</body>
</html>
