<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pizza Demo · Stage 4 — Ustawienia · Print</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  /* Page chrome — design canvas host (matches Stage 3) */
  html, body { margin: 0; padding: 0; background: #ECEAE3; font-family: var(--font-sans); }
  #root { min-height: 100vh; }

  /* ─────────── Admin token overlay (lifted from Stage 3) ─────────── */
  .admin {
    --admin-shell: #F4F2EC;
    --admin-shell-border: #E2DED2;
    --admin-canvas: #FAFAF8;
    --admin-card: #FFFFFF;
    --admin-card-border: #E5E1D6;
    --admin-card-border-hover: #D4D0C2;
    --admin-row-hover: #F7F4ED;
    --admin-divider: #EDE9DF;

    --admin-text-primary: #1A1A1A;
    --admin-text-body: #3F3F3A;
    --admin-text-muted: #6B6B66;
    --admin-text-faint: #A8A59C;

    --admin-nav-active-bg: #FCEEEF;
    --admin-nav-active-text: #C0202E;
    --admin-nav-hover-bg: #EFEBDF;

    --admin-radius: 8px;
    --admin-radius-sm: 6px;
    --admin-radius-card: 10px;

    background: var(--admin-canvas);
    color: var(--admin-text-primary);
    font-family: var(--font-sans);
    font-feature-settings: "ss01", "cv11";
  }
  .admin[data-tone="cool"] {
    --admin-shell: #F2F4F7;
    --admin-shell-border: #E4E7EC;
    --admin-canvas: #FFFFFF;
    --admin-card: #FFFFFF;
    --admin-card-border: #E4E7EC;
    --admin-card-border-hover: #D0D5DD;
    --admin-row-hover: #F7F8FA;
    --admin-divider: #EAECF0;
    --admin-text-primary: #101828;
    --admin-text-body: #344054;
    --admin-text-muted: #667085;
    --admin-text-faint: #98A2B0;
    --admin-nav-hover-bg: #EAECF0;
  }

  .admin[data-density="compact"] { --admin-card-pad: 14px; --admin-row-h: 56px; --admin-card-gap: 10px; }
  .admin[data-density="comfortable"] { --admin-card-pad: 20px; --admin-row-h: 72px; --admin-card-gap: 16px; }

  .admin button { font-family: inherit; }
  .admin input, .admin select, .admin textarea { font-family: inherit; }

  .scrollbox::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbox::-webkit-scrollbar-thumb { background: #D4D0C2; border-radius: 8px; }
  .scrollbox::-webkit-scrollbar-track { background: transparent; }

  .avatar { display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; font-weight: 700; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600;
    line-height: 1; letter-spacing: 0.01em; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }

  .hr-soft { height: 1px; background: var(--admin-divider); border: 0; }

  /* ─────────── PRINT OVERRIDES — flatten the design canvas ─────────── */
  /* Logical page size is generous so the largest artboard (1440 × 1480)
     fits without further scaling; browser scales to paper at print time. */
  @page { size: 1560px 1640px; margin: 32px; }

  @media print {
    html, body { background: #FFFFFF !important; overflow: visible !important; }

    /* Force CSS colors to render in print */
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    /* Disable the canvas pan/zoom viewport */
    .design-canvas {
      width: auto !important;
      height: auto !important;
      overflow: visible !important;
      background: #FFFFFF !important;
      cursor: default !important;
      position: static !important;
    }
    /* The inner transform wrapper — drop the scale + translate */
    .design-canvas > div {
      transform: none !important;
      transform-origin: 0 0 !important;
      width: auto !important;
      position: static !important;
      padding: 0 !important;
    }

    /* Hide canvas chrome: zoom toolbar, post-its, drag grips, expand buttons */
    .dc-grip, .dc-expand { display: none !important; }
    .design-canvas [style*="position: fixed"] { display: none !important; }

    /* Each section: stack artboards vertically, full-bleed */
    [data-dc-section] {
      margin: 0 0 0 0 !important;
      padding: 0 !important;
      width: auto !important;
      page-break-before: always;
      break-before: page;
    }
    [data-dc-section]:first-of-type {
      page-break-before: auto;
      break-before: auto;
    }
    [data-dc-section] > div {
      padding: 0 !important;
      width: auto !important;
    }
    /* Section title (first child div with padding) */
    [data-dc-section] > div:first-child {
      padding: 0 0 32px !important;
    }
    /* Row of artboards → flex column */
    [data-dc-section] > div:last-child {
      display: flex !important;
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 80px !important;
      width: auto !important;
      max-width: none !important;
    }

    /* Each artboard slot becomes one printed page */
    [data-dc-slot] {
      break-inside: avoid;
      page-break-inside: avoid;
      break-after: page;
      page-break-after: always;
      margin-top: 28px !important;
    }
    /* Last slot in last section: don't trail with a blank page */
    [data-dc-section]:last-of-type [data-dc-slot]:last-of-type {
      break-after: auto;
      page-break-after: auto;
    }

    /* Promote the floating label row into a normal block above the card */
    [data-dc-slot] .dc-labelrow {
      position: static !important;
      margin: 0 0 10px !important;
      bottom: auto !important; left: auto !important;
    }

    /* Card gets a print-friendly border instead of a soft shadow */
    [data-dc-slot] .dc-card {
      box-shadow: none !important;
      border: 1px solid #D4D0C2 !important;
    }

    /* Hide the floating tweaks panel + any portal overlays */
    [data-tweaks-panel], [data-edit-mode-toggle] { display: none !important; }
  }

  /* ─────────── ON-SCREEN PREVIEW (so the print page is testable) ─────────── */
  /* Apply the same flattening on screen too — the file is exclusively for
     print, no point keeping the interactive canvas around. */
  .design-canvas {
    width: auto !important;
    height: auto !important;
    overflow: visible !important;
    cursor: default !important;
    position: static !important;
  }
  .design-canvas > div {
    transform: none !important;
    transform-origin: 0 0 !important;
    width: auto !important;
    position: static !important;
  }
  .dc-grip, .dc-expand { display: none !important; }
  [data-dc-section] > div:last-child {
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important;
    gap: 64px !important;
    width: auto !important;
  }
  [data-dc-slot] .dc-labelrow {
    position: static !important;
    margin: 0 0 10px !important;
    bottom: auto !important; left: auto !important;
  }
  [data-dc-slot] { margin-top: 24px; }
  [data-dc-slot] .dc-card {
    box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Shared admin chrome (sidebar, topbar, manual-close banner, fixtures, icons) -->
  <script type="text/babel" src="admin-shared.jsx"></script>

  <!-- Settings primitives + sections -->
  <script type="text/babel" src="settings-shared.jsx"></script>
  <script type="text/babel" src="section-general.jsx"></script>
  <script type="text/babel" src="section-hours.jsx"></script>
  <script type="text/babel" src="section-content.jsx"></script>
  <script type="text/babel" src="section-zones.jsx"></script>
  <script type="text/babel" src="section-operations.jsx"></script>
  <script type="text/babel" src="section-stubs.jsx"></script>

  <!-- Canvas + tweaks -->
  <script type="text/babel" src="app.jsx"></script>

  <!-- EditMode persistence block -->
  <script>
    window.__STAGE4_DEFAULTS = /*EDITMODE-BEGIN*/{
      "tone": "warm",
      "density": "comfortable",
      "soundOn": true,
      "dirty": false,
      "showPreview": true,
      "tempClosed": false,
      "activeSection": "general"
    }/*EDITMODE-END*/;
  </script>

  <!-- Auto-print: wait for fonts + React mount + a small settle delay, then print() -->
  <script type="text/babel">
    (async () => {
      // Wait for Babel to parse all sibling babel scripts and React to mount.
      const waitForArtboards = () => new Promise((resolve) => {
        const tick = () => {
          const slots = document.querySelectorAll('[data-dc-slot]');
          if (slots.length >= 12) return resolve();
          requestAnimationFrame(tick);
        };
        tick();
      });

      try { if (document.fonts && document.fonts.ready) { await document.fonts.ready; } } catch (_) {}
      await waitForArtboards();
      // Settle layout (images, fixed positioning unwinds, etc.)
      await new Promise(r => setTimeout(r, 800));
      try { window.print(); } catch (_) {}
    })();
  </script>
</body>
</html>
